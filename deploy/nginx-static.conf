server {
    listen 80;
    server_name _;

    location /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public";
    }
}
