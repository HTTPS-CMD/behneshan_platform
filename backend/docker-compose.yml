version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: behneshan_db
    environment:
      POSTGRES_DB: behneshan_db
      POSTGRES_USER: behneshan_user
      POSTGRES_PASSWORD: securepassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: behneshan_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: